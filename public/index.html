/* Layout: an English exercise book — ruled header band, team score strip, one stage card; single bright light theme chosen for classroom projectors */
:root{
  --paper:#f5f8fe; --card:#ffffff; --rule:#cbdcf2; --rule-soft:#e4edf9;
  --ink:#1c2a4f; --ink-soft:#5c6b8d;
  --red:#e0413a; --red-soft:#fde9e7; --gold:#ffc83d; --gold-deep:#e89a00;
  --leaf:#1f9d55; --leaf-soft:#e2f6ea; --sky:#3b7ddd; --sky-soft:#e7f0fc;
  --shade:rgba(28,42,79,.55);
  --t0:#e0413a; --t1:#3b7ddd; --t2:#e38f00; --t3:#1f9d55;
  --f-letter:"Playwrite NZ","Andika","Comic Sans MS",cursive;
  --f-display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:12px 40px;display:flex;flex-direction:column;gap:16px}

/* header: ruled like 四线三格 */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-radius:20px;background:
  linear-gradient(var(--card),var(--card)) padding-box;border:2px solid var(--rule);position:relative;overflow:hidden}
header::before{display:none;content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;background:
  repeating-linear-gradient(180deg,transparent 0 17px,var(--rule-soft) 17px 18px)}
.brand{display:flex;align-items:center;gap:12px;position:relative}
.logo{font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor;font-size:34px;line-height:1;background:var(--red);color:#fff;border-radius:14px;padding:8px 12px;transform:rotate(-4deg)}
.logo span{color:var(--gold)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4vw,34px);margin:0;letter-spacing:1px}
.sub{font-size:13px;color:var(--ink-soft);margin:0}
.hbtns{display:flex;gap:8px;position:relative}
.ghost{background:var(--card);border:2px solid var(--rule);border-radius:12px;padding:8px 14px;font-weight:600}
.ghost:hover{border-color:var(--sky)}

/* scores */
.teams{display:flex;flex-wrap:wrap;gap:10px}
.team{--c:var(--t0);display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--c);border-radius:16px;padding:6px 14px 6px 10px;transition:transform .2s}
.team .dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.team .nm{font-weight:700}
.team .sc{font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor;font-size:28px;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.team.on{background:var(--c);color:#fff;transform:translateY(-2px)}
.team.on .dot{background:#fff}
.team .turn{font-size:12px;background:#fff;color:var(--c);border-radius:8px;padding:1px 6px;font-weight:700}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}

/* home */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.mode{background:var(--card);border:2px solid var(--rule);border-radius:22px;padding:14px 18px 18px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-3px);border-color:var(--c,var(--sky))}
.mode .art{height:104px;border-radius:14px;background:var(--bg,var(--sky-soft));display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;line-height:1.35;padding-inline:10px;font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor;font-size:54px;color:var(--c,var(--sky));letter-spacing:2px}
.mode h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:6px 0 0}
.mode p{margin:0;color:var(--ink-soft);font-size:14px}
.art small{font-size:22px;color:var(--red);margin-inline:6px;-webkit-text-stroke:0;font-family:var(--f-body)}
.art .gap{display:inline-block;width:.6em;border-bottom:4px dashed currentColor;height:.7em;margin-left:4px}
.homeinfo{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--ink-soft);font-size:14px}
.homeinfo b{color:var(--ink)}

/* game */
.gbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.gbar h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0}
.dots{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--rule-soft);border:2px solid var(--rule)}
.dots i.ok{background:var(--leaf);border-color:var(--leaf)}
.dots i.no{background:var(--red-soft);border-color:var(--red)}
.dots i.now{border-color:var(--ink);transform:scale(1.2)}
.stage{background:var(--card);border:2px solid var(--rule);border-radius:24px;padding:22px clamp(14px,3vw,30px) 26px;min-height:440px;display:flex;flex-direction:column;gap:18px}
.ask{font-size:clamp(20px,3vw,26px);font-weight:700;text-align:center;margin:0;text-wrap:balance}
.ask .L{font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor;color:var(--red);font-size:1.3em}
.prompt{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;max-width:760px;width:100%;margin:0 auto}
.opt{background:var(--card);border:3px solid var(--rule);border-radius:18px;min-height:100px;padding:10px;font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor;font-size:54px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .12s,border-color .12s}
.opt:hover:not(:disabled){transform:translateY(-3px);border-color:var(--sky)}
.opt:disabled{cursor:default}
.opt.right{background:var(--leaf-soft);border-color:var(--leaf)}
.opt.wrong{background:var(--red-soft);border-color:var(--red)}
.opt.small{font-size:24px}
.opt .emo{font-size:52px;line-height:1.1}
.opt .w{font-size:24px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fb{min-height:52px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;font-size:20px;text-align:center}
.fb .ok{color:var(--leaf);font-family:var(--f-display);font-weight:400;font-size:28px}
.fb .no{color:var(--red);font-family:var(--f-display);font-weight:400;font-size:28px}
.fb .L{font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor;color:var(--red)}
.primary{background:var(--sky);color:#fff;border:0;border-radius:14px;padding:12px 22px;font-size:18px;font-weight:700;box-shadow:0 4px 0 #2a5fae}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #2a5fae}
.speak{background:var(--gold);border:0;border-radius:999px;padding:8px 16px;font-weight:700;box-shadow:0 3px 0 var(--gold-deep)}

/* word prompt */
.pic{font-size:96px;line-height:1}
.pic svg,.opt svg{width:1em;height:1em;vertical-align:middle}
.word{font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor;font-size:clamp(44px,8vw,64px);letter-spacing:2px}
.hole{display:inline-block;min-width:.8em;min-height:.9em;vertical-align:baseline;border-bottom:5px solid var(--red);color:var(--red);text-align:center}
.hole.q{color:transparent;-webkit-text-stroke:0}
.lettercard{font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor;font-size:96px;line-height:1;background:var(--sky-soft);border-radius:22px;padding:14px 28px;color:var(--ink)}
.lettercard b{color:var(--red)}
.k{display:inline-block;width:.6em;height:.8em;vertical-align:baseline;border-bottom:3px solid var(--red);margin:0 2px}
.opt.right .k{width:auto;height:auto;color:var(--red)}
.opt.right .k::after{content:attr(data-l)}
.pic img,.opt .emo img,.wcard .emo img,.basket .in i img{width:1em;height:1em;object-fit:contain;display:inline-block;vertical-align:middle;border-radius:.12em}
.pic img{width:1.3em;height:1.3em}
.opt .emo img,.wcard .emo img{width:1.5em;height:1.5em}

/* match board */
.board{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px;border-radius:18px;background:var(--sky-soft)}
.col.lo{background:var(--red-soft)}
.col h4{grid-column:1/-1;margin:0;font-size:15px;color:var(--ink-soft);font-weight:700}
.tile{background:var(--card);border:3px solid var(--rule);border-radius:16px;min-height:86px;font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor;font-size:50px;line-height:1;transition:transform .15s,opacity .3s}
.tile.sel{border-color:var(--sky);background:#d4e5fb;transform:scale(1.06)}
.tile.done{border-color:var(--leaf);background:var(--leaf-soft);opacity:.45;cursor:default}

/* gap strip */
.strip{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.pair{display:flex;gap:4px;align-items:flex-end;background:var(--sky-soft);border-radius:16px;padding:10px 14px;font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor;font-size:clamp(40px,7vw,58px);line-height:1}
.pair .s{min-width:.75em;text-align:center}
.pair .blank{border:3px dashed var(--red);border-radius:10px;color:var(--red);animation:pulse 1.2s infinite}
.pair .blank.filled{border-style:solid;animation:none;background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf)}
@keyframes pulse{50%{background:var(--red-soft)}}

/* sort board */
.baskets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.basket{border:3px dashed var(--rule);border-radius:18px;padding:10px;min-height:170px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:8px}
.basket .bl{font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor;font-size:44px;line-height:1}
.basket.ready{border-color:var(--sky);background:var(--sky-soft)}
.basket .in{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.basket .in span{font-size:13px;background:var(--leaf-soft);border-radius:10px;padding:2px 8px;font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor}
.basket .in span b{color:var(--red)}
.basket .in span i{font-style:normal;font-size:22px;display:block;text-align:center}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.wcard{background:var(--card);border:3px solid var(--rule);border-radius:16px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;min-width:100px}
.wcard .emo{font-size:46px;line-height:1.1}
.wcard .emo svg{width:1em;height:1em}
.wcard .w{font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor;font-size:22px}
.wcard.sel{border-color:var(--sky);background:#d4e5fb;transform:scale(1.06)}

/* 四线三格 */
.gridc{width:100%;max-width:380px;height:auto;display:block;background:var(--card);border-radius:12px}
.biglet{font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor;font-size:110px;line-height:1;color:var(--ink);background:var(--sky-soft);border-radius:22px;padding:10px 30px}
.opt svg.mini,.mini{width:84px;height:auto}
.num{font-family:"Andika",var(--f-body);font-weight:700;-webkit-text-stroke:0}
.opt .lab{font-family:var(--f-body);font-size:18px;font-weight:700}

/* overlay */
.ov{position:fixed;inset:0;background:var(--shade);display:grid;place-items:center;padding:16px;z-index:10}
.panel{background:var(--card);border-radius:26px;padding:24px clamp(16px,4vw,32px);width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;display:flex;flex-direction:column;gap:18px;text-align:center}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,34px);margin:0}
.gifts{display:flex;justify-content:center;gap:clamp(10px,3vw,24px);flex-wrap:wrap}
.gift{width:clamp(96px,26vw,150px);aspect-ratio:3/4;max-width:100%;border:0;background:none;padding:0;perspective:800px}
.gift .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.gift.open .in{transform:rotateY(180deg)}
.gift .fr,.gift .bk{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:grid;place-items:center;font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor}
.gift .fr{background:
  radial-gradient(circle at 50% 50%,var(--gold) 0 22%,transparent 23%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 8px,transparent 8px 16px),var(--sky);
  border:5px solid #fff;outline:3px solid var(--sky);box-shadow:0 6px 0 #2a5fae;font-size:48px;color:var(--ink)}
.gift:not(:disabled):hover .fr{transform:translateY(-4px) rotate(-2deg)}
.gift .bk{font-family:"Andika",var(--f-body);-webkit-text-stroke:0;font-weight:700;transform:rotateY(180deg);background:var(--leaf-soft);border:4px solid var(--leaf);color:var(--leaf);font-size:clamp(40px,10vw,60px)}
.gift .bk.minus{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.gift .bk.ten{background:#fff4d1;border-color:var(--gold-deep);color:var(--gold-deep)}
.gift.dim{opacity:.45}
.gift:disabled{cursor:default}
.rmsg{font-size:22px;font-weight:700;min-height:34px;margin:0}

/* settings */
.set{text-align:left;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.row>label{font-weight:700;min-width:90px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--rule);background:var(--card);border-radius:10px;padding:6px 14px;font-weight:700}
.seg button.on{background:var(--sky);border-color:var(--sky);color:#fff}
select,input[type=text]{font:inherit;border:2px solid var(--rule);border-radius:10px;padding:6px 10px;background:var(--card);color:var(--ink);min-width:0}
select{min-width:88px;font-family:var(--f-body);font-size:18px;font-weight:700;padding:6px 10px}
.tedit{display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;gap:8px}
.tedit .dot{width:16px;height:16px;border-radius:50%}
.tedit .v{font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor;font-size:20px;min-width:2.5ch;text-align:center;font-variant-numeric:tabular-nums}
.sq{width:36px;height:36px;border:2px solid var(--rule);background:var(--card);border-radius:10px;font-weight:700;font-size:18px}
.danger{border-color:var(--red);color:var(--red)}
.note{font-size:13px;color:var(--ink-soft);margin:0}

/* end */
.rank{display:flex;flex-direction:column;gap:10px}
.rank div{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:14px;background:var(--sky-soft);font-weight:700;font-size:20px}
.rank div:first-child{background:#fff4d1}
.rank .pos{font-family:var(--f-letter);font-size:28px;width:1.5em}
.rank .pts{margin-left:auto;font-family:var(--f-letter);font-size:30px;font-variant-numeric:tabular-nums}
.btnrow{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}

@media (max-width:640px){
  .board{grid-template-columns:1fr}
  .tile{min-height:70px;font-size:40px}
  .baskets{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stage{min-height:0}
  .pic{font-size:78px}
  .opt{min-height:84px;font-size:44px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body style="margin:0">

<canvas id="fx"></canvas>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">A<span>a</span></div>
      <div><h1>字母闯关乐园</h1><p class="sub">一年级 26 个字母 · 答对就能抽卡牌</p></div>
    </div>
    <div class="hbtns">
      <button class="ghost" id="homeBtn" hidden>回到首页</button>
      <button class="ghost" id="setBtn">设置</button>
    </div>
  </header>


  <section id="home">
    <div class="modes" id="modes"></div>
    <p class="homeinfo" id="homeinfo" style="margin-top:14px"></p>
  </section>

  <section id="game" hidden>
    <div class="gbar">
      <h2 id="gtitle"></h2>
      <div class="dots" id="dots"></div>
    </div>
    <div class="stage" id="stage" style="margin-top:12px"></div>
  </section>
</div>

<div class="ov" id="reward" hidden>
  <div class="panel">
    <h2 id="rtitle">选一个礼物！</h2>
    <div class="gifts" id="gifts"></div>
    <p class="rmsg" id="rmsg"></p>
    <div class="btnrow"><button class="primary" id="rgo" hidden>下一题</button></div>
  </div>
</div>

<div class="ov" id="settings" hidden>
  <div class="panel set">
    <h2 style="text-align:center">设置</h2>
    <div class="row"><label for="rangeSel">学习范围</label><span style="font-family:var(--f-letter);font-weight:400;font-synthesis:none;-webkit-text-stroke:.025em currentColor">A –</span><select id="rangeSel"></select></div>
    <div class="row"><label>每轮题数</label><div class="seg" id="pcount"></div></div>
    <div class="row"><label>朗读单词</label><div class="seg" id="voice"></div></div>
    <p class="note">每答对一题，就能从三张卡牌里抽一张：+3、+10、−1，三张牌每次都会重新洗牌。笔顺和占格按照您附的书写范例（斜体手写体，f 占三格）；E、M、m 的笔画在范例上不清晰，暂不出题。</p>
    <div class="btnrow">
      <button class="primary" id="setClose">好了</button>
    </div>
  </div>
</div>

const shuffle = a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function distract(ans, n, pool){ // lowercase-based distractors, same case as ans
  const low = ans.toLowerCase(), up = ans!==low;
  let c = (CONF[low]||'').split('');
  c = c.concat(shuffle(pool.map(x=>x.toLowerCase())));
  const out=[]; for(const x of c){ if(x!==low && !out.includes(x)) out.push(x); if(out.length===n) break; }
  return out.map(x=>up?x.toUpperCase():x);
}

  let h=`<svg viewBox="0 0 ${W} ${H}" width="100%" aria-hidden="true">`;
  for(let k=0;k<4;k++) h+=`<line x1="8" x2="${W-8}" y1="${gridY(k)}" y2="${gridY(k)}" stroke="${k===2?'#e0413a':'#6f7fa3'}" stroke-width="${k===2?2.2:1.6}" ${k===1||k===2?'stroke-dasharray="8 6"':''}/>`;
  ['上格','中格','下格'].forEach((t,i)=>h+=`<text x="12" y="${gridY(i)+28}" font-size="13" fill="#8a97b5" font-family="PingFang SC,Microsoft YaHei,sans-serif">${t}</text>`);
  if(ch){
    const reg={M:[1,2],UM:[0,2],ML:[1,3],ALL:[0,3]}[region];
    let top=gridY(reg[0]); const bot=gridY(reg[1]);
    if('ijt'.includes(ch)) top=gridY(0)+14;
    MCV=MCV||document.createElement('canvas'); const x=MCV.getContext('2d');
    x.font='400 200px "Playwrite NZ", Andika, cursive';
    const m=x.measureText(ch), asc=m.actualBoundingBoxAscent, desc=m.actualBoundingBoxDescent;
    const sz=200*(bot-top)/(asc+desc), base=top+(bot-top)*asc/(asc+desc), c=color||'#1c2a4f';
    h+=`<text x="${W/2+20}" y="${base}" text-anchor="middle" font-size="${sz}" fill="${c}" stroke="${c}" stroke-width="2.4" stroke-linejoin="round" style="font-family:'Playwrite NZ',Andika,cursive">${ch}</text>`;
  }
  el.innerHTML=h+'</svg>';
}
function miniGrid(cells){
  return `<svg class="mini" viewBox="0 0 84 66" aria-hidden="true">${cells.map((c,i)=>`<rect x="2" y="${3+i*20}" width="80" height="20" fill="${c?'#9cc3ea':'#ffffff'}"/>`).join('')}
  ${[0,1,2,3].map(k=>`<line x1="2" x2="82" y1="${3+k*20}" y2="${3+k*20}" stroke="${k===2?'#e0413a':'#6f7fa3'}" stroke-width="1.6" ${k===1||k===2?'stroke-dasharray="5 4"':''}/>`).join('')}</svg>`;
}

/* ---------- question types ---------- */
function mc(stage, {ask, prompt, opts, ans, cls='', after}){
  stage.innerHTML = `<p class="ask">${ask}</p><div class="prompt">${prompt}</div>
    <div class="opts">${opts.map((o,i)=>`<button class="opt ${cls}" data-i="${i}">${o}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
  const bs=[...stage.querySelectorAll('.opt')];
  bs.forEach(b=>b.onclick=()=>{
    if(G.locked) return;
    const ok = +b.dataset.i===ans;
    bs.forEach(x=>x.disabled=true);
    bs[ans].classList.add('right');
    if(!ok){ b.classList.add('wrong','shake'); }
    finish(ok, after ? after(ok) : '');
  });
}

function genMatch(stage){
  let letters = sample(range(), 6);
  const lc = range().map(c=>c.toLowerCase());
  if(['b','d'].every(c=>lc.includes(c)) && Math.random()<.5){ letters = shuffle(['B','D',...sample(range().filter(c=>!'BD'.includes(c)),4)]); }
  stage.innerHTML = `<p class="ask">把大写字母和它的小写好朋友配成一对</p>
    <div class="board"><div class="col up"><h4>大写</h4></div><div class="col lo"><h4>小写</h4></div></div><div class="fb" id="fb"></div>`;
  const up=stage.querySelector('.up'), lo=stage.querySelector('.lo');
  shuffle(letters).forEach(c=>up.insertAdjacentHTML('beforeend',`<button class="tile" data-l="${c}" data-s="u">${c}</button>`));
  shuffle(letters).forEach(c=>lo.insertAdjacentHTML('beforeend',`<button class="tile" data-l="${c}" data-s="l">${c.toLowerCase()}</button>`));
  let sel=null, left=letters.length, miss=0;
  stage.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
    if(t.classList.contains('done')||G.locked) return;
    if(!sel || sel.dataset.s===t.dataset.s){ if(sel) sel.classList.remove('sel'); sel=t; t.classList.add('sel'); sfx.pop(); return; }
    if(sel.dataset.l===t.dataset.l){
      [sel,t].forEach(x=>{x.classList.remove('sel');x.classList.add('done');}); sel=null; left--; sfx.pop(); say(t.dataset.l);
      if(!left) finish(true, miss?`错了 ${miss} 次，继续加油`:'一次都没错，真棒');
    } else {
      miss++; sfx.bad(); const a=sel; [a,t].forEach(x=>{x.classList.add('shake');setTimeout(()=>x.classList.remove('shake','sel'),420);}); sel=null;
    }
  });
}

function genGap(stage){
  const L = ABC.slice(0, Math.min(S.end,14)+1).split('');
  const st = Math.floor(Math.random()*(L.length-4)), seq=L.slice(st,st+5);
  const bi = Math.floor(Math.random()*5), upper = Math.random()<.5;
  const ans = upper ? seq[bi] : seq[bi].toLowerCase();
  const opts = shuffle([ans, ...distract(ans,3,L)]);
  const strip = `<div class="strip">${seq.map((c,i)=>`<div class="pair"><span class="s ${i===bi&&upper?'blank':''}">${i===bi&&upper?'?':c}</span><span class="s ${i===bi&&!upper?'blank':''}">${i===bi&&!upper?'?':c.toLowerCase()}</span></div>`).join('')}</div>`;
  mc(stage,{ask:`问号那里缺了哪个${upper?'大写':'小写'}字母？`, prompt:strip, opts, ans:opts.indexOf(ans), after:()=>{
    const b=stage.querySelector('.blank'); b.textContent=ans; b.classList.add('filled'); say(seq[bi]);
    return `<span class="L">${seq[bi]}${seq[bi].toLowerCase()}</span>`;
  }});
}

function genWordLetter(stage){
  const w = pick(wordsIn());
  const ans = w.k, opts = shuffle([ans, ...distract(ans,3,range())]);
  mc(stage,{ask: w.k==='x'&&w.w[0]!=='x' ? '听一听，空格里是哪个字母？' : '这个单词是哪个字母开头的？',
    prompt:`<div class="pic">${w.e}</div><div><div class="word">${masked(w,'hole q')}</div><div style="text-align:center;margin-top:8px"><button class="speak" id="spk">听一听</button></div></div>`,
    opts, ans:opts.indexOf(ans), after:()=>{ const h=stage.querySelector('.hole'); h.textContent=w.w[kidx(w)]; h.classList.remove('q'); say(w.w); return `<span class="L">${esc(w.w)}</span>`; }});
  $('#spk').onclick=()=>say(w.w); setTimeout(()=>say(w.w),250);
}

function genWordPic(stage){
  const ws = wordsIn(); const T = pick([...new Set(ws.map(w=>w.k))]);
  const right = pick(ws.filter(w=>w.k===T));
  const others = shuffle(ws.filter(w=>w.k!==T && !w.w.toLowerCase().includes(T)));
  const seen=new Set([T]), wrong=[]; for(const w of others){ if(!seen.has(w.k)){ seen.add(w.k); wrong.push(w);} if(wrong.length===3) break; }
  const all = shuffle([right,...wrong]);
  const isX = T==='x';
  mc(stage,{ask: isX?'哪个单词里有 <span class="L">Xx</span> 的发音？':`哪个单词是 <span class="L">${T.toUpperCase()}${T}</span> 开头的？`,
    prompt:`<div class="lettercard">${T.toUpperCase()}<b>${T}</b></div>`, cls:'small',
    opts: all.map(w=>`<span class="emo">${w.e}</span><span class="w">${masked(w)}</span>`), ans: all.indexOf(right),
    after:()=>{ say(right.w); return `<span class="L">${esc(right.w)}</span>`; }});
  setTimeout(()=>say(T.toUpperCase()),250);
}

function genSort(stage){
  const ws = wordsIn(); const all=[...new Set(ws.map(w=>w.k))]; const multi=all.filter(k=>ws.filter(w=>w.k===k).length>1); const keys = sample(multi.length>=3?multi:all, 3);
  const cards = shuffle(keys.flatMap(k=>sample(ws.filter(w=>w.k===k),2)));
  stage.innerHTML = `<p class="ask">给小卡片找家：点一张卡片，再点它的字母篮子</p>
    <div class="cards">${cards.map((w,i)=>`<button class="wcard" data-i="${i}"><span class="emo">${w.e}</span><span class="w">${masked(w)}</span></button>`).join('')}</div>
    <div class="baskets">${keys.map(k=>`<button class="basket" data-k="${k}"><span class="bl">${k.toUpperCase()}${k}</span><span class="in"></span></button>`).join('')}</div><div class="fb" id="fb"></div>`;
  let sel=null, left=cards.length, miss=0;
  const bks=[...stage.querySelectorAll('.basket')];
  stage.querySelectorAll('.wcard').forEach(c=>c.onclick=()=>{
    if(G.locked) return; if(sel) sel.classList.remove('sel'); sel=c; c.classList.add('sel'); say(cards[+c.dataset.i].w); bks.forEach(b=>b.classList.add('ready'));
  });
  bks.forEach(b=>b.onclick=()=>{
    if(!sel||G.locked) return; const w=cards[+sel.dataset.i];
    if(w.k===b.dataset.k){
      b.querySelector('.in').insertAdjacentHTML('beforeend',`<span><i>${w.e}</i>${full(w)}</span>`);
      sel.remove(); sel=null; left--; sfx.pop(); bks.forEach(x=>x.classList.remove('ready'));
      if(!left) finish(true, miss?`错了 ${miss} 次`:'全部放对了');
    } else { miss++; sfx.bad(); b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),420); }
  });
}

function genStroke(stage){
  const pool = range().flatMap(c=>[c,c.toLowerCase()]).filter(c=>STROKES[c]);
  const c = pick(pool), n = STROKES[c];
  const opts=[1,2,3,4].map(k=>`<span class="num">${k}</span><span class="lab">笔</span>`);
  mc(stage,{ask:`写 <span class="L">${c}</span> 一共要几笔？`, prompt:`<div class="gridc" id="gc"></div>`, opts, ans:n-1,
    after:()=>{ say(c); return `<span class="L">${c}</span> 写 <b class="num">${n}</b> 笔`; }});
  const draw=()=>drawGrid($('#gc'), c, GRID[c]); draw();
  document.fonts && document.fonts.load('400 100px "Playwrite NZ"').then(draw).catch(()=>{});
}

function genGrid(stage){
  const lows = range().map(c=>c.toLowerCase());
  const c = Math.random()<.25 ? pick(range()) : pick(lows);
  const reg = GRID[c]; const ans = GRIDOPT.findIndex(o=>o[0]===reg);
  mc(stage,{ask:`<span class="L">${c}</span> 在四线三格里占哪几格？`,
    prompt:`<div class="biglet">${c}</div><div class="gridc" id="gc"></div>`, cls:'small',
    opts: GRIDOPT.map(o=>`${miniGrid(o[2])}<span class="lab">${o[1]}</span>`), ans,
    after:()=>{ drawGrid($('#gc'), c, reg, '#e0413a'); say(c); return `<span class="L">${c}</span> 占 <b>${GRIDOPT[ans][1]}</b>`; }});
  drawGrid($('#gc'), null);
}

const MODES = {
  match:{name:'大小写连连看', desc:'大写找小写，配成一对一对', art:'A<small>⇄</small>a', c:'var(--sky)', bg:'var(--sky-soft)', board:true, gen:genMatch},
  gap:{name:'补全大小写', desc:'Aa 到 Oo，找出缺的字母', art:'Bb C<span class="gap"></span>', c:'var(--red)', bg:'var(--red-soft)', gen:genGap},
  word:{name:'单词找字母', desc:'看图听音，给单词找开头字母', art:'<span style="font-size:.75em;margin-right:8px">🍎</span><span class="gap"></span>pple', c:'var(--leaf)', bg:'var(--leaf-soft)', gen:s=>pick([genWordLetter,genWordPic,genWordLetter,genSort])(s)},
  stroke:{name:'笔顺小能手', desc:'这个字母要写几笔？', art:'A<small>1 2 3</small>', c:'var(--gold-deep)', bg:'#fff4d1', gen:genStroke},
  grid:{name:'四线三格', desc:'字母住在哪几格？', art:'g p y', c:'#7b4bd0', bg:'#efe8fc', gen:genGrid},
  mix:{name:'字母大乱斗', desc:'所有题型随机出，最考验', art:'?!', c:'var(--ink)', bg:'#e9edf5', gen:s=>pick([genMatch,genGap,genWordLetter,genWordPic,genSort,genStroke,genGrid])(s)}
};

/* ---------- flow ---------- */
function renderScores(){}
function renderHome(){
  $('#modes').innerHTML = Object.entries(MODES).map(([k,m])=>`<button class="mode" data-m="${k}" style="--c:${m.c};--bg:${m.bg}"><div class="art"><span>${m.art}</span></div><h3>${m.name}</h3><p>${m.desc}</p></button>`).join('');
  $('#modes').querySelectorAll('.mode').forEach(b=>b.onclick=()=>startGame(b.dataset.m));
  $('#homeinfo').innerHTML = `<span>学习范围 <b>A – ${ABC[S.end]}</b></span><span>每轮 <b>${S.per}</b> 题</span><span>每题请一位同学回答，答对抽一张卡牌</span>`;
}
function startGame(m){
  G = {m, i:0, total: MODES[m].board ? Math.ceil(S.per/2) : S.per, res:[], locked:false};
  $('#home').hidden=true; $('#game').hidden=false; $('#homeBtn').hidden=false;
  $('#gtitle').textContent = MODES[m].name;
  nextQ();
}
function nextQ(){
  if(G.i>=G.total) return showEnd();
  G.locked=false; renderScores(); renderDots();
  MODES[G.m].gen($('#stage'));
}
function renderDots(){ $('#dots').innerHTML = Array.from({length:G.total},(_,i)=>`<i class="${G.res[i]===true?'ok':G.res[i]===false?'no':i===G.i?'now':''}"></i>`).join(''); }
function finish(ok,msg){
  if(G.locked) return; G.locked=true; G.res[G.i]=ok; renderDots();
  const fb=$('#fb');
  if(ok){ sfx.good(); fb.innerHTML=`<span class="ok">答对啦！</span><span>${msg||''}</span>`; setTimeout(openReward,900); }
  else { sfx.bad(); fb.innerHTML=`<span class="no">没关系！</span><span>正确答案：${msg||''}</span><button class="primary" id="nx">下一题</button>`; $('#nx').onclick=advance; }
}
function advance(){ G.i++; save(); nextQ(); }
function openReward(){
  const vals=shuffle([3,10,-1]);
  $('#rtitle').textContent = '选一张卡牌！';
  $('#rmsg').textContent=''; $('#rgo').hidden=true;
  $('#gifts').innerHTML = vals.map((v,i)=>`<button class="gift" data-i="${i}" aria-label="卡牌 ${i+1}"><div class="in"><div class="fr">?</div><div class="bk ${v<0?'minus':v===10?'ten':''}">${v>0?'+'+v:'−1'}</div></div></button>`).join('');
  $('#reward').hidden=false;
  const gs=[...$('#gifts').querySelectorAll('.gift')];
  gs.forEach(g=>g.onclick=()=>{
    gs.forEach(x=>x.disabled=true); g.classList.add('open');
    const v=vals[+g.dataset.i];
    setTimeout(()=>{
      if(v===10){ sfx.big(); confetti(); $('#rmsg').textContent='超级大奖！+10 分'; }
      else if(v>0){ sfx.plus(); $('#rmsg').textContent=`得到 ${v} 分！`; }
      else { sfx.minus(); $('#rmsg').textContent='哎呀，被小怪兽拿走 1 分'; }
      setTimeout(()=>{ gs.forEach(x=>{ if(x!==g){ x.classList.add('open','dim'); } }); $('#rgo').hidden=false; $('#rgo').textContent = G.i+1>=G.total?'本轮结束':'下一题'; $('#rgo').focus(); },700);
    },450);
  });
}
$('#rgo').onclick=()=>{ $('#reward').hidden=true; advance(); };
function showEnd(){
  const right = G.res.filter(Boolean).length;
  $('#stage').innerHTML = `<p class="ask">这一轮答对 ${right} / ${G.total} 题</p>
    <div class="btnrow"><button class="primary" id="again">再来一轮</button><button class="ghost" id="tohome">换个玩法</button></div>`;
  if(right===G.total) confetti();
  $('#again').onclick=()=>startGame(G.m); $('#tohome').onclick=goHome;
  renderDots();
}
function goHome(){ G=null; $('#home').hidden=false; $('#game').hidden=true; $('#homeBtn').hidden=true; $('#reward').hidden=true; renderScores(); renderHome(); }
$('#homeBtn').onclick=goHome;

/* ---------- settings ---------- */
function renderSettings(){
  $('#rangeSel').innerHTML=ABC.split('').map((c,i)=>i<5?'':`<option value="${i}" ${i===S.end?'selected':''}>${c}</option>`).join('');
  $('#pcount').innerHTML=[5,10,15,20].map(n=>`<button class="${S.per===n?'on':''}" data-n="${n}">${n}</button>`).join('');
  $('#pcount').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.per=+b.dataset.n; save(); renderSettings(); renderHome(); });
  $('#voice').innerHTML=`<button class="${S.voice?'on':''}" data-v="1">开</button><button class="${!S.voice?'on':''}" data-v="0">关</button>`;
  $('#voice').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.voice=b.dataset.v==='1'; save(); renderSettings(); });
}
$('#rangeSel').onchange=e=>{ S.end=+e.target.value; save(); renderHome(); };
$('#setBtn').onclick=()=>{ renderSettings(); $('#settings').hidden=false; };
$('#setClose').onclick=()=>{ $('#settings').hidden=true; };

/* ---------- confetti ---------- */
function confetti(){
  const cv=$('#fx'), x=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=['#e0413a','#3b7ddd','#ffc83d','#1f9d55','#7b4bd0'];
  const ps=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6,c:pick(cols),a:Math.random()*6}));
  let f=0; (function step(){ x.clearRect(0,0,cv.width,cv.height); ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.a+=.1; x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-4,-2,8+p.r,5);x.restore();}); if(++f<150) requestAnimationFrame(step); else x.clearRect(0,0,cv.width,cv.height); })();
}

try{ document.fonts && document.fonts.load('400 100px "Playwrite NZ"'); }catch(e){}
renderScores(); renderHome(); renderSettings();
</script>
</body>
